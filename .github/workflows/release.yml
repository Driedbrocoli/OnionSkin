# Build the archives people download, and attach them to a release.
#
# Runs when a version tag is pushed:
#
#     git tag v0.1.0 && git push origin v0.1.0
#
# or by hand from the Actions tab, which is how to try it without committing
# to a version number.
#
# There is no third-party action here. Everything is the `gh` command line and
# `cargo`, both of which GitHub's runners already have — an action from the
# marketplace is somebody else's code running with a token that can write to
# this repository, which is a lot to accept for a step that is four lines of
# shell. The few `uses:` lines are all `actions/…`, which is GitHub's own
# code running on GitHub's own runners; publishing to Pages by hand would mean
# a branch, a force push and a token to do it with, which is more to get wrong
# than the two steps it would replace.

name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        # Left blank on purpose, and not required. A version box that arrives
        # pre-filled with a number is a trap: dispatching without touching it
        # — which is what the API does when it is not passed a version —
        # silently builds that release instead of this one, and replaces its
        # archives with the wrong binaries. Blank means "the version in
        # Cargo.toml", which is the only answer that cannot be stale.
        description: "Version to build, without the v. Blank uses Cargo.toml."
        required: false
        default: ""

permissions:
  contents: write

jobs:
  # Made once, before the builds, so four jobs uploading at the same time are
  # not four jobs racing to create the same release.
  open:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.name.outputs.tag }}
      version: ${{ steps.name.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Work out what this is called
        id: name
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            version="${{ inputs.version }}"
            if [ -z "$version" ]; then
              # The version this checkout actually is, rather than one
              # somebody has to remember to type.
              version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
              echo "No version given; building $version from Cargo.toml."
            fi
          else
            version="${GITHUB_REF_NAME#v}"
          fi
          if [ -z "$version" ]; then
            echo "Could not work out a version to build." >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"

      # Published straight away, not as a draft. A draft release is invisible
      # and its files are not downloadable, so drafting until every runner has
      # finished means nothing can be downloaded while the slowest one is
      # still queued — and macOS runners queue for a long time. Each archive
      # becomes available the moment its own job uploads it, which is worth
      # more than the few minutes where the release is half full.
      - name: Open the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${{ steps.name.outputs.tag }}"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "$tag already exists; the archives will be replaced."
          else
            gh release create "$tag" \
              --title "Onionskin ${{ steps.name.outputs.version }}" \
              --notes "Download the file for your machine, unpack it, and run \`onionskin install\`. Nothing asks for an administrator password."
          fi
          # And if a previous run left it as a draft, take it out of one.
          gh release edit "$tag" --draft=false

  build:
    needs: open
    strategy:
      # One platform failing should not stop the others from being built:
      # three archives and a note about the fourth beats no archives.
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
            pdfium: pdfium-linux-x64.tgz
            library: lib/libpdfium.so
            beside: libpdfium.so
            exe: ""
            stable: linux-x64
          - os: windows-latest
            platform: windows
            pdfium: pdfium-win-x64.tgz
            library: bin/pdfium.dll
            beside: pdfium.dll
            exe: ".exe"
            stable: windows-x64
          - os: macos-14
            platform: macos
            pdfium: pdfium-mac-arm64.tgz
            library: lib/libpdfium.dylib
            beside: libpdfium.dylib
            exe: ""
            stable: macos-arm64
          # The Intel Mac build, made on an Apple silicon runner rather than an
          # Intel one. GitHub is retiring the macos-13 image, and a job asking
          # for it sits in a queue that may never come — which is worse than it
          # sounds, because the one archive that never appears is invisible next
          # to four that did. Cross-compiling needs nothing Apple's toolchain
          # does not already have, and it runs on a machine that exists.
          - os: macos-14
            platform: macos
            pdfium: pdfium-mac-x64.tgz
            library: lib/libpdfium.dylib
            beside: libpdfium.dylib
            exe: ""
            stable: macos-x64
            target: x86_64-apple-darwin
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Cache what cargo downloaded
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          # Keyed on the archive, not the runner: two jobs now run on macos-14
          # and they build different things.
          key: ${{ matrix.stable }}-cargo-${{ hashFiles('Cargo.lock') }}

      - name: Build both programs
        shell: bash
        run: |
          # A cross build needs two: the programs being shipped, and a native
          # `onionskin` to run `package` with — the packager reads the binary it
          # is given, so it does not have to be the same architecture as it.
          cargo build --release --locked
          if [ -n "${{ matrix.target }}" ]; then
            rustup target add "${{ matrix.target }}"
            cargo build --release --locked --target "${{ matrix.target }}"
            echo "BIN=target/${{ matrix.target }}/release" >> "$GITHUB_ENV"
          else
            echo "BIN=target/release" >> "$GITHUB_ENV"
          fi

      # pdfium is a C++ library and is not on crates.io, so it is fetched as a
      # binary from the build everyone uses. BSD and Apache licensed, which is
      # why it can be shipped inside the archive at all.
      - name: Fetch the PDF renderer
        shell: bash
        run: |
          curl -fL -o pdfium.tgz \
            "https://github.com/bblanchon/pdfium-binaries/releases/latest/download/${{ matrix.pdfium }}"
          mkdir -p pdfium
          tar -xzf pdfium.tgz -C pdfium
          cp "pdfium/${{ matrix.library }}" "$BIN/${{ matrix.beside }}"

      # A cross-built program cannot be asked what it can see — it is not for
      # this machine. What can be checked is that it is for the machine it
      # claims to be for, which is the mistake worth catching: an archive named
      # x64 holding an arm64 program runs nowhere and looks fine.
      - name: Check it can see the renderer
        if: matrix.target == ''
        shell: bash
        run: $BIN/onionskin${{ matrix.exe }} doctor || true

      - name: Check it was built for the chip on the label
        if: matrix.target != ''
        shell: bash
        run: |
          for program in onionskin onionskin-desktop; do
            file "$BIN/$program"
            lipo -archs "$BIN/$program" | grep -qw x86_64 \
              || { echo "$program is not an x86_64 program"; exit 1; }
          done

      # Told explicitly where everything is rather than left to find it beside
      # the running program, because on a cross build the running program is
      # the native one and its neighbours are the wrong architecture.
      - name: Build the archives
        shell: bash
        run: |
          ./target/release/onionskin${{ matrix.exe }} package \
            --platform ${{ matrix.platform }} \
            --binary "$BIN/onionskin${{ matrix.exe }}" \
            --desktop "$BIN/onionskin-desktop${{ matrix.exe }}" \
            --library "$BIN/${{ matrix.beside }}" \
            --version "${{ needs.open.outputs.version }}" \
            --out dist

      # macOS is built twice, for two different chips, and both produce an
      # archive of the same name. The chip goes in the name so neither is
      # silently overwritten by the other.
      - name: Name the macOS archives after the chip they are for
        if: runner.os == 'macOS'
        shell: bash
        run: |
          # Taken from the archive's own name, not from the runner's: both Mac
          # jobs run on macos-14 now, so the runner no longer says which chip
          # the archive is for — and two jobs agreeing it is arm64 would have
          # one silently replace the other on the release.
          chip="${{ matrix.stable }}"
          chip="${chip#macos-}"
          for file in dist/*; do
            mv "$file" "${file%.tar.gz}-$chip.tar.gz"
          done

      # A second copy of each, named without the version. GitHub serves the
      # newest release at /releases/latest/download/<exact name>, so a name
      # with a version in it cannot be written down in a README or a script —
      # it stops working the day there is a 0.1.1. Both are uploaded: the
      # versioned name is the nicer thing to find in a Downloads folder, and
      # the plain one is what `curl` can be pointed at forever.
      - name: Add a copy with a name that never changes
        shell: bash
        run: |
          for file in dist/*; do
            case "$file" in
              *.tar.gz) cp "$file" "dist/onionskin-${{ matrix.stable }}.tar.gz" ;;
              *.zip)    cp "$file" "dist/onionskin-${{ matrix.stable }}.zip" ;;
              *.deb)    cp "$file" "dist/onionskin-${{ matrix.stable }}.deb" ;;
            esac
          done
          ls -l dist

      - name: Attach them to the release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ needs.open.outputs.tag }}" dist/* --clobber

  # `sudo apt install onionskin`, which is the only install instruction most
  # Linux users will ever follow.
  #
  # A `.deb` attached to a release is a file somebody downloads once and then
  # never hears about again — no `apt upgrade`, and no way to find out the
  # version they are running was replaced a year ago. The same `.deb` with
  # three small text files beside it is a repository their machine looks after
  # for them, and building those three files is what `onionskin apt-repo` does.
  #
  # Two things come out of this job, because the repository is wanted in two
  # places. It is published to GitHub Pages, which needs no server and is where
  # `apt` will fetch it from; and it is attached to the release as a tarball,
  # which is what somebody copies onto a server of their own. Neither depends
  # on the other, so a repository that cannot be published is still a
  # repository that can be downloaded.
  apt:
    needs: [open, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.pages.outputs.page_url }}
    env:
      # Set this in the repository's secrets to have the archive signed. Left
      # unset, everything below still works and the instructions say
      # `[trusted=yes]` instead — which is honest about what it is rather than
      # pretending to a security it does not have.
      APT_SIGNING_KEY: ${{ secrets.APT_SIGNING_KEY }}
    steps:
      - uses: actions/checkout@v4

      - name: Cache what cargo downloaded
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: apt-cargo-${{ hashFiles('Cargo.lock') }}

      - name: Build the program that builds the repository
        run: cargo build --release --locked --bin onionskin

      # The versioned name, not the stable one. Both are on the release and
      # they are the same package; putting both in the pool would give apt two
      # entries for one version, differing only in where the file is.
      - name: Fetch the package that was just released
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p debs
          gh release download "${{ needs.open.outputs.tag }}" \
            --pattern "onionskin_*_amd64.deb" --dir debs
          ls -l debs

      - name: Build the repository
        id: build
        run: |
          site="https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}"
          echo "site=$site" >> "$GITHUB_OUTPUT"
          ./target/release/onionskin apt-repo \
            --deb debs/onionskin_${{ needs.open.outputs.version }}_amd64.deb \
            --out apt \
            --url "$site" \
            --origin "Onionskin" \
            --label "Onionskin" \
            --description "Onionskin packages" | tee instructions.txt

      # Signing is custody of a private key, so it is a step that does nothing
      # unless somebody has decided to take that on. `gpg` is already on the
      # runner and is the thing everyone else's archives are signed with.
      - name: Sign it, if there is a key to sign it with
        if: env.APT_SIGNING_KEY != ''
        run: |
          echo "$APT_SIGNING_KEY" | gpg --batch --import
          keyid=$(gpg --list-secret-keys --with-colons | awk -F: '/^sec:/ {print $5; exit}')
          echo "Signing with $keyid"
          # Both files, not one. InRelease is what modern apt asks for;
          # Release.gpg is what older apt asks for, and an archive that serves
          # only one of them fails on machines nobody thought to test.
          gpg --batch --yes --default-key "$keyid" --clearsign \
            -o apt/dists/stable/InRelease apt/dists/stable/Release
          gpg --batch --yes --default-key "$keyid" --detach-sign --armor \
            -o apt/dists/stable/Release.gpg apt/dists/stable/Release
          # The public half, so a machine can check the signature. Named for
          # keyrings rather than apt-key, because a key added with apt-key is
          # trusted for every repository on the machine and not only this one.
          gpg --batch --yes --export --armor "$keyid" \
            > apt/onionskin-archive-keyring.asc

      # A page at the address people will paste into a browser when the sources
      # line does not work, which is the moment they need it most.
      - name: Write the page that explains it
        run: |
          site="${{ steps.build.outputs.site }}"
          if [ -n "$APT_SIGNING_KEY" ]; then
            add_key="curl -fsSL $site/onionskin-archive-keyring.asc | sudo tee /etc/apt/trusted.gpg.d/onionskin.asc &gt; /dev/null"
            sources="deb [signed-by=/etc/apt/trusted.gpg.d/onionskin.asc] $site stable main"
          else
            add_key="# unsigned archive — nothing to add"
            sources="deb [trusted=yes] $site stable main"
          fi
          cat > apt/index.html <<HTML
          <!doctype html>
          <meta charset="utf-8">
          <meta name="viewport" content="width=device-width, initial-scale=1">
          <title>Install Onionskin with apt</title>
          <style>
            body { font: 16px/1.6 system-ui, sans-serif; max-width: 42rem;
                   margin: 3rem auto; padding: 0 1rem; }
            pre  { background: #f4f4f4; padding: 1rem; overflow-x: auto;
                   border-radius: 6px; }
            @media (prefers-color-scheme: dark) {
              body { background: #111; color: #eee; }
              pre  { background: #1d1d1d; }
            }
          </style>
          <h1>Install Onionskin with apt</h1>
          <p>Typed once. After this, <code>apt upgrade</code> keeps Onionskin up
             to date along with everything else on the machine.</p>
          <pre>$add_key
          echo '$sources' | sudo tee /etc/apt/sources.list.d/onionskin.list
          sudo apt update &amp;&amp; sudo apt install onionskin</pre>
          <p>Version ${{ needs.open.outputs.version }}. This is a plain static
             directory — nothing runs on the server. To host it yourself, take
             <code>onionskin-apt-repo.tar.gz</code> from the
             <a href="https://github.com/${{ github.repository }}/releases/latest">release</a>,
             unpack it anywhere a web server can see, and put your own address in
             the sources line above.</p>
          HTML

      # Attached whether or not Pages works, because this is the copy somebody
      # puts on a server of their own.
      - name: Attach the repository to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tar -czf onionskin-apt-repo.tar.gz -C apt .
          gh release upload "${{ needs.open.outputs.tag }}" \
            onionskin-apt-repo.tar.gz --clobber

      # GitHub's own actions, not the marketplace's. Publishing a directory to
      # Pages by hand means a branch, a force push and a token, which is more
      # moving parts than the two steps it replaces.
      - name: Parcel it up for Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: apt

      # Best effort. Pages has to be turned on for the repository once, by
      # hand, and until it is this step fails — which must not turn a release
      # that built and uploaded everything into a red one.
      - name: Publish it
        id: pages
        continue-on-error: true
        uses: actions/deploy-pages@v4

      - name: Say where it went
        run: |
          {
            echo "## apt repository"
            echo
            if [ "${{ steps.pages.outcome }}" = "success" ]; then
              echo "Published to ${{ steps.build.outputs.site }}"
            else
              echo "Not published — turn on Pages for this repository"
              echo "(Settings → Pages → Source: GitHub Actions) and run this again."
            fi
            echo
            echo "Attached to the release as \`onionskin-apt-repo.tar.gz\` either way."
            echo
            echo '```'
            cat instructions.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
