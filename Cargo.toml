[package]
name = "onionskin"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
description = "Add words to a page that is already printed."
license = "MIT"
readme = "README.md"

[dependencies]
# PDF structure: read boxes and rotation, transform content, write pages.
lopdf = "0.32"
# Drawing PDF pages to pixels. `thread_safe` is not optional: `render::Shared`
# relies on it to serialise every call into the library.
pdfium-render = { version = "0.8", features = ["thread_safe"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "tiff", "bmp"] }
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
anyhow = "1"
tempfile = "3"
uuid = { version = "1", features = ["v4"] }
ttf-parser = "0.25.1"
# Compressing the download. `rust_backend` is not optional: it is miniz_oxide,
# which is Rust — the zlib backend would link a C library. Already in the tree
# by way of `image`, so this costs no new dependency.
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }

# The desktop window. egui draws every widget itself onto an OpenGL surface —
# there is no web view, no system toolkit and no C++ library behind it, so the
# program is still one file that runs on a machine with nothing installed.
#
# `default-features = false` is not tidiness. The defaults bring wgpu, naga and
# accesskit, which is 340 more crates for a second rendering backend this does
# not use. glow is the OpenGL one, and it is enough to draw a page.
eframe = { version = "0.35", default-features = false, features = [
    "glow",
    "default_fonts",
    "x11",
    "wayland",
] }
egui = "0.35"
egui_extras = { version = "0.35", default-features = false }

[dev-dependencies]
approx = "0.5"

# The command line, and the window. Two binaries rather than one because
# Windows decides at link time whether a program owns a console: a GUI built as
# a console program flashes a black window behind itself, and a console program
# built as a GUI prints to nowhere. They cannot both be right in one file.
[[bin]]
name = "onionskin"
path = "src/main.rs"

[[bin]]
name = "onionskin-desktop"
path = "src/desktop/main.rs"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
